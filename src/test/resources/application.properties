# Test Configuration - H2 in-memory database
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.driver=org.h2.Driver

# Hibernate Configuration for Tests  
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false

# Validation Configuration for Tests
%test.quarkus.hibernate-validator.method-validation.allow-overriding-parameter-constraints=true

# HTTP Configuration for Tests
%test.quarkus.http.test-port=0

# Logging Configuration for Tests
%test.quarkus.log.level=INFO
%test.quarkus.log.category."com.ejemplo".level=DEBUG
# MySQL Database Configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/crud_db?useSSL=false&serverTimezone=UTC}
quarkus.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# La contraseña por defecto es solo para desarrollo local: en producción define SPRING_DATASOURCE_PASSWORD
quarkus.datasource.password=${SPRING_DATASOURCE_PASSWORD:test123}
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
# En producción solo se actualiza el esquema: "drop-and-create" borraba todos los datos en cada arranque.
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false
# En desarrollo y pruebas sí se recrea la base y se cargan los datos de ejemplo (import.sql)
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# HTTP Configuration
quarkus.http.port=8081

# OpenAPI/Swagger Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# HTTP Request/Response Logging
quarkus.log.category."com.juniverse.quarkus.crud.filter.HttpLoggingFilter".level=INFO
# JAR único con todas las dependencias (fat jar): target/quarkus-crud-<version>-runner.jar
quarkus.package.jar.type=uber-jar
